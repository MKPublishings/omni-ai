name = "ion-ai-dashboard"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
ORCHESTRATOR_URL = "https://ionirix.com"
IMAGES_URL = "https://ion-ai-images.omni-ai.workers.dev"
AUDIO_URL = "https://ion-ai-audio.omni-ai.workers.dev"
EMBEDDINGS_URL = "https://ion-ai-embeddings.omni-ai.workers.dev"
ROUTER_URL = "https://ion-ai-router.omni-ai.workers.dev"
