name = "ION-ai-dashboard"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
ORCHESTRATOR_URL = "https://ION-ai.ION-ai.workers.dev"
IMAGES_URL = "https://ION-ai-images.ION-ai.workers.dev"
AUDIO_URL = "https://ION-ai-audio.ION-ai.workers.dev"
EMBEDDINGS_URL = "https://ION-ai-embeddings.ION-ai.workers.dev"
ROUTER_URL = "https://ION-ai-router.ION-ai.workers.dev"
