name = "ion-ai-images"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[ai]
binding = "AI"

[vars]
ION_IMAGE_PIPELINE_V2 = "1"
COMFYUI_HOST = "https://img.ionirix.com"
COMFYUI_WS = "wss://img.ionirix.com/ws"
COMFYUI_MOCK = "true"
DEFAULT_CHECKPOINT = "ion-citizen-xl-vpred-v2.0"
