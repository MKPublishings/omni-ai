name = 'ion-ai'
account_id = "f25101d7be3be725e525cba88810b656"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[ai]
binding = "AI"

[vars]
ION_ENV = "production"
APP_BASE_URL = "https://ion-ai.omni-ai.workers.dev"
EMAIL_TRANSPORT = "resend"
EMAIL_FROM = "noreply@ionirix.com"
EMAIL_REPLY_TO = "mirnes@ionirix.com"
MAILCHANNELS_API_URL = "https://api.mailchannels.net/tx/v1/send"
# Public outbound email plan:
# - configure RESEND_API_KEY as a Wrangler secret
# - verify the sending domain ionirix.com inside Resend
# - publish SPF/DKIM/DMARC records for ionirix.com from the Resend dashboard
# - keep MAILCHANNELS_API_URL only as a legacy fallback path if EMAIL_TRANSPORT is changed back to mailchannels
# Configure the following as Wrangler secrets or vars for Stripe billing:
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PUBLISHABLE_KEY
STRIPE_PREMIUM_MONTHLY_PRICE_ID = "price_1TN0JIBJEKcExtO66AR2kxnp"
STRIPE_PREMIUM_YEARLY_PRICE_ID = "price_1TN0OwBJEKcExtO6XWK1617l"
STRIPE_ENTERPRISE_MONTHLY_PRICE_ID = "price_1TN0SrBJEKcExtO6DpypdWEA"
STRIPE_ENTERPRISE_YEARLY_PRICE_ID = "price_1TN0W9BJEKcExtO6hpAoVcmV"
STRIPE_CHECKOUT_SUCCESS_URL = "/billing/success"
STRIPE_CHECKOUT_CANCEL_URL = "/billing/cancel"

# Optional ION model alias.
# MODEL_ION = "@cf/meta/llama-3.1-8b-instruct"
# MODEL_IMAGE = "@cf/black-forest-labs/flux-1-schnell"
# ION_SIMULATION_PATHS = "2" # integer 2..4
# ION_MEMORY_RETENTION_DAYS = "45"
# ION_SESSION_MAX_AGE_HOURS = "72"
# ION_AUTONOMY_LEVEL = "balanced" # conservative | balanced | aggressive
# ION_ADMIN_KEY = "replace-with-strong-secret"
# ION_RESPONSE_MIN_CHARS = "2000"
# ION_RESPONSE_BASE_CHARS = "4500"
# ION_RESPONSE_MAX_CHARS = "50000"
# ION_MIN_OUTPUT_TOKENS = "512"
# ION_MAX_OUTPUT_TOKENS = "8192"
# ION_ENV = "development" # set to "production" to disable debug response headers
# Configure RESEND_API_KEY as a Wrangler secret for outbound verification email.

# KV namespaces for phase 2-3 systems (commented out - create in Cloudflare dashboard first)
# [[kv_namespaces]]
# binding = "MIND"
# id = "ddf695e484604a5a974ba5d4165f7102"
# preview_id = "mind_kv_preview"

# [[kv_namespaces]]
# binding = "MEMORY"
# id = "355f713328174c48aff53fad8d81d73e"
# preview_id = "memory_kv_preview"
# enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ionirix"
database_id = "7395c7a8-5f61-4a35-b493-bfbebfe3ef36"
migrations_dir = "migrations"

# Sovereign world-state bus Durable Object binding.
[[durable_objects.bindings]]
name = "WORLD_STATE_BUS"
class_name = "WorldStateBusDurableObject"

[[migrations]]
tag = "v2-world-state-bus"
new_sqlite_classes = ["WorldStateBusDurableObject"]

# Scheduled tasks for system maintenance
[triggers]
crons = ["*/15 * * * *"]
