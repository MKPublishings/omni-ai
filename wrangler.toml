name = "ION-ai"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
ION_ENV = "production"

# Optional ION model alias.
# MODEL_ION = "@cf/meta/llama-3.1-8b-instruct"
# MODEL_IMAGE = "@cf/black-forest-labs/flux-1-schnell"
# ION_SIMULATION_PATHS = "2" # integer 2..4
# ION_MEMORY_RETENTION_DAYS = "45"
# ION_SESSION_MAX_AGE_HOURS = "72"
# ION_AUTONOMY_LEVEL = "balanced" # conservative | balanced | aggressive
# ION_ADMIN_KEY = "replace-with-strong-secret"
# ION_RESPONSE_MIN_CHARS = "2000"
# ION_RESPONSE_BASE_CHARS = "4500"
# ION_RESPONSE_MAX_CHARS = "50000"
# ION_MIN_OUTPUT_TOKENS = "512"
# ION_MAX_OUTPUT_TOKENS = "8192"
# ION_ENV = "development" # set to "production" to disable debug response headers

[[kv_namespaces]]
binding = "MIND"
id = "ddf695e484604a5a974ba5d4165f7102"
preview_id = "mind_kv_preview"

[[kv_namespaces]]
binding = "MEMORY"
id = "355f713328174c48aff53fad8d81d73e"
preview_id = "memory_kv_preview"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

# Optional D1 long-term memory binding.
# [[d1_databases]]
# binding = "ION_DB"
# database_name = "ION_memory"
# database_id = "<replace-with-d1-id>"
# migrations_dir = "migrations"

# Optional Durable Object session binding.
# [[durable_objects.bindings]]
# name = "ION_SESSION"
# class_name = "IONSession"

# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["IONSession"]

# Optional self-maintenance cron.
# [triggers]
# crons = ["*/30 * * * *"]