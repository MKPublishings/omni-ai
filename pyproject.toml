[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni_ai"
version = "0.1.0"
description = "Omni Ai Python client for unified cognitive routing via Cloudflare backend"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Omni Ai Team" }
]
dependencies = [
  "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://mkomni.com"
Repository = "https://github.com/MKPublishings/omni-ai"

[tool.setuptools.packages.find]
where = ["."]
include = ["omni_ai*"]