<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ionirix v2.0.0 — Specs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #2c3e50;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 24px;
      color: #667eea;
      margin-bottom: 10px;
    }

    .nav {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      border-top: 1px solid #ecf0f1;
      padding-top: 15px;
      flex-wrap: wrap;
    }

    .nav a {
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      color: #667eea;
      transition: all 0.3s;
    }

    .nav a:hover,
    .nav a.active {
      background: #667eea;
      color: white;
    }

    .content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .section {
      margin-bottom: 30px;
    }

    h2 {
      font-size: 18px;
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .search-input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .search-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .specs-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .spec-item {
      border: 1px solid #bdc3c7;
      border-radius: 8px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .spec-item:hover {
      border-color: #667eea;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
      transform: translateX(4px);
    }

    .spec-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .spec-slug {
      font-size: 12px;
      color: #95a5a6;
      font-family: 'Courier New', monospace;
      margin-bottom: 8px;
    }

    .spec-desc {
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 12px;
    }

    .spec-meta {
      display: flex;
      gap: 15px;
      font-size: 12px;
      color: #95a5a6;
    }

    .spec-badge {
      display: inline-block;
      background: #f0f4ff;
      color: #667eea;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .detail-panel {
      background: #f5f7fa;
      border-radius: 8px;
      padding: 20px;
      margin-top: 30px;
    }

    .detail-header {
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .detail-content {
      font-size: 14px;
      line-height: 1.6;
      color: #2c3e50;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #667eea;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Specification Registry — v2.0.0</h1>
      <p>Browse and search system specifications</p>
      <nav class="nav">
        <a href="index-v2.html">Home</a>
        <a href="memory-v2.html">Memory</a>
        <a href="tools-v2.html">Tools</a>
        <a href="specs-v2.html" class="active">Specs</a>
        <a href="system-v2.html">System</a>
      </nav>
    </header>

    <div class="content">
      <div class="section">
        <h2>Search Specifications</h2>
        <input type="text" class="search-input" id="search-input" placeholder="Search specs..." />
      </div>

      <div class="section">
        <h2>Available Specifications</h2>
        <div class="specs-list" id="specs-container">
          <div class="loading">Loading specifications...</div>
        </div>
      </div>

      <div class="detail-panel" id="detail-panel" style="display: none">
        <div class="detail-header">
          <div class="detail-title" id="detail-title"></div>
          <div class="spec-meta">
            <span>Version: <span id="detail-version"></span></span>
            <span>Category: <span id="detail-category"></span></span>
          </div>
        </div>
        <div class="detail-content" id="detail-desc"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import apiClient from './api-client.js';

    let allSpecs = [];

    async function loadSpecs() {
      try {
        const result = await apiClient.listSpecs();
        allSpecs = result.specs || [];
        renderSpecs(allSpecs);
      } catch (err) {
        console.error('Failed to load specs:', err);
        document.getElementById('specs-container').innerHTML = '<div class="error">Error loading specs: ' + err.message + '</div>';
      }
    }

    function renderSpecs(specs) {
      if (!specs.length) {
        document.getElementById('specs-container').innerHTML = '<div class="empty">No specifications found</div>';
        return;
      }

      const html = specs
        .map(
          (spec) => `
      <div class="spec-item" onclick="selectSpec('${spec.slug}')">
        <div class="spec-title">${spec.title}</div>
        <div class="spec-slug">slug: ${spec.slug}</div>
        <div class="spec-desc">${(spec.description || '').substring(0, 100)}</div>
        <div class="spec-meta">
          <span class="spec-badge">${spec.version || '1.0'}</span>
          <span>${spec.category || 'general'}</span>
        </div>
      </div>
    `
        )
        .join('');

      document.getElementById('specs-container').innerHTML = html;
    }

    window.selectSpec = async function (slug) {
      try {
        const spec = await apiClient.getSpec(slug);
        document.getElementById('detail-title').textContent = spec.title;
        document.getElementById('detail-version').textContent = spec.version || '1.0';
        document.getElementById('detail-category').textContent = spec.category || 'general';
        document.getElementById('detail-desc').textContent = spec.description || 'No description';
        document.getElementById('detail-panel').style.display = 'block';
      } catch (err) {
        alert('Failed to load spec: ' + err.message);
      }
    };

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allSpecs.filter(
        (s) =>
          s.title.toLowerCase().includes(query) ||
          s.slug.toLowerCase().includes(query) ||
          (s.description || '').toLowerCase().includes(query)
      );
      renderSpecs(filtered);
    });

    // Load specs on page load
    window.addEventListener('load', loadSpecs);
  </script>
</body>
</html>
