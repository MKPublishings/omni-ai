<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ionirix LLC - Chat</title>
  <meta name="description" content="Chat with Ionirix across reasoning, coding, visual, lore, simulation, and environment workflows." />
  <meta property="og:title" content="Ionirix LLC - Chat" />
  <meta property="og:description" content="Use Ionirix LLC chat for live reasoning, architecture, coding, and multimodal workflows." />
  <meta property="og:site_name" content="Ionirix LLC" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=2" />
  <link rel="stylesheet" href="/styles/base.css?v=20260302-1" />
  <link rel="stylesheet" href="/styles/layout.css?v=20260302-2" />
  <link rel="stylesheet" href="/styles/chat.css?v=20260331-1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" />
</head>
<body class="page">
  <div id="layout">
    <aside id="sidebar">
      <h1 class="logo">Ionirix</h1>

      <nav class="nav">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/chat.html" class="nav-link">Chat</a>
        <a href="/codex.html" class="nav-link">Codex</a>
        <a href="/modes.html" class="nav-link">Modes</a>
        <a href="/settings.html" class="nav-link">Settings</a>
        <a href="/about.html" class="nav-link">About</a>
        <a href="/legal.html" class="nav-link">Legal</a>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span class="status-text">System: Online</span>
      </div>
    </aside>

    <main id="main" class="chat-main">
      <header class="chat-header">
        <div>
          <h2>Ionirix Chat</h2>
        </div>
        <div class="chat-controls">
          <div class="model-selector dropdown-control" id="mode-dropdown">
            <label for="mode-btn">Mode</label>
            <button
              id="mode-btn"
              type="button"
              class="chat-control-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="mode-menu"
            >Auto</button>
            <div id="mode-menu" class="chat-dropdown" role="listbox" aria-label="Mode selection" aria-labelledby="mode-btn" tabindex="-1">
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="auto">Auto</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="architect">Architect</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="analyst">Analyst</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="visual">Visual</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="lore">Lore</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="reasoning">Reasoning</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="coding">Coding</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="knowledge">Knowledge</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="system-knowledge">System Knowledge</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="anatomy">Anatomy</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="environment">Environment</button>
              <button type="button" class="chat-dropdown-item" role="option" aria-selected="false" data-value="simulation">Simulation</button>
            </div>
          </div>
        </div>
      </header>

      <section id="chat-area">
        <div id="chat-container"></div>

        <div id="typing-indicator" class="typing-indicator" aria-live="polite" style="display: none;">
          Ion is typing...
        </div>

        <details id="simulation-panel" class="simulation-panel" hidden>
          <summary>Simulation Mode Controls</summary>
          <div class="simulation-controls">
            <button id="simulation-start-btn" type="button" class="chat-action-btn">Start Simulation</button>
            <button id="simulation-pause-btn" type="button" class="chat-action-btn">Pause Simulation</button>
            <button id="simulation-reset-btn" type="button" class="chat-action-btn">Reset Simulation</button>
            <button id="simulation-export-btn" type="button" class="chat-action-btn">Export Simulation State</button>
          </div>
          <label for="simulation-rules-editor" class="simulation-rules-label">Simulation Mode Rules Editor</label>
          <textarea id="simulation-rules-editor" class="simulation-rules-editor" rows="5" placeholder="rules:
- domain: system-state
- time: linear
- entities: bounded"></textarea>
          <div class="simulation-log-wrap">
            <strong>Simulation Log</strong>
            <div id="simulation-log" class="simulation-log" aria-live="polite"></div>
          </div>
        </details>

        <div id="input-area">
          <input
            id="user-input"
            type="text"
            placeholder="Enter to send..."
            autocomplete="off"
          />
          <button id="send-btn">Send</button>
        </div>
        <div id="age-gate-composer-notice" class="age-gate-composer-notice" hidden aria-live="polite">
          Age verification required for image generation.
        </div>
        <div id="legal-attestation-composer-notice" class="age-gate-composer-notice" hidden aria-live="polite">
          Legal attestation required for chat use. Confirm your jurisdiction and acceptance of responsible-use terms.
          <button id="open-legal-attestation-btn" type="button" class="chat-action-btn">Complete Legal Attestation</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/scripts/chat.js?v=20260314-1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="/scripts/age-gate.js"></script>
  <script src="/scripts/page-transition.js"></script>
</body>
</html>
