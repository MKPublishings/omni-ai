<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ionirix photon favicon">
  <defs>
    <radialGradient id="photonHalo" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#dff3ff" stop-opacity="0.98"/>
      <stop offset="0.24" stop-color="#8fc3ff" stop-opacity="0.92"/>
      <stop offset="0.52" stop-color="#5e73ff" stop-opacity="0.66"/>
      <stop offset="0.78" stop-color="#6b49db" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#120a37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="photonCore" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#d7ebff"/>
      <stop offset="0.66" stop-color="#8ab7ff"/>
      <stop offset="1" stop-color="#4c67ff"/>
    </radialGradient>
    <radialGradient id="ionRing" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#9cb6ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#6f5bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="28" fill="url(#photonHalo)" filter="url(#softGlow)"/>
  <circle cx="32" cy="32" r="18" fill="url(#ionRing)" opacity="0.9"/>
  <circle cx="32" cy="32" r="13.5" fill="url(#photonCore)"/>
  <circle cx="32" cy="32" r="8" fill="#edf5ff" opacity="0.72"/>
  <circle cx="28.4" cy="27.8" r="3.2" fill="#ffffff" opacity="0.96"/>
</svg>
