<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ionirix v2.0.0 — System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #2c3e50;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 24px;
      color: #667eea;
      margin-bottom: 10px;
    }

    .nav {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      border-top: 1px solid #ecf0f1;
      padding-top: 15px;
      flex-wrap: wrap;
    }

    .nav a {
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      color: #667eea;
      transition: all 0.3s;
    }

    .nav a:hover,
    .nav a.active {
      background: #667eea;
      color: white;
    }

    .content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .section {
      margin-bottom: 30px;
    }

    h2 {
      font-size: 18px;
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .status-card {
      border: 1px solid #bdc3c7;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .status-label {
      font-size: 12px;
      color: #95a5a6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .status-value {
      font-size: 24px;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-ok {
      background: #d5f4e6;
      color: #27ae60;
    }

    .badge-warning {
      background: #ffeaa7;
      color: #e67e22;
    }

    .badge-error {
      background: #ffcccc;
      color: #e74c3c;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .details-table th {
      background: #f5f7fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #bdc3c7;
    }

    .details-table td {
      padding: 12px;
      border-bottom: 1px solid #ecf0f1;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-item {
      border: 1px solid #ecf0f1;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      padding: 12px 15px;
      background: #f5f7fa;
    }

    .event-time {
      font-size: 11px;
      color: #95a5a6;
      font-family: 'Courier New', monospace;
      margin-bottom: 4px;
    }

    .event-type {
      font-size: 13px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 4px;
    }

    .event-data {
      font-size: 12px;
      color: #7f8c8d;
      font-family: 'Courier New', monospace;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #667eea;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
    }

    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 System Dashboard — v2.0.0</h1>
      <p>Monitor system health, metrics, and events in real-time</p>
      <nav class="nav">
        <a href="index-v2.html">Home</a>
        <a href="memory-v2.html">Memory</a>
        <a href="tools-v2.html">Tools</a>
        <a href="specs-v2.html">Specs</a>
        <a href="system-v2.html" class="active">System</a>
      </nav>
    </header>

    <div class="content">
      <div class="section">
        <h2>System Status</h2>
        <div class="status-grid" id="status-container">
          <div class="loading">Loading status...</div>
        </div>
        <button onclick="refreshStatus()">Refresh</button>
      </div>

      <div class="section">
        <h2>Health Checks</h2>
        <div id="health-container">
          <div class="loading">Checking health...</div>
        </div>
      </div>

      <div class="section">
        <h2>Metrics</h2>
        <table class="details-table" id="metrics-container">
          <tr>
            <td class="loading" colspan="2">Loading metrics...</td>
          </tr>
        </table>
      </div>

      <div class="section">
        <h2>Recent Events</h2>
        <div class="events-list" id="events-container">
          <div class="loading">Loading events...</div>
        </div>
        <button onclick="refreshEvents()" style="margin-top: 15px;">Refresh Events</button>
      </div>
    </div>
  </div>

  <script type="module">
    import apiClient from './api-client.js';

    async function loadStatus() {
      try {
        const status = await apiClient.getStatus();

        const html = `
        <div class="status-card">
          <div class="status-label">Version</div>
          <div class="status-value">${status.version}</div>
          <div class="status-badge badge-ok">RUNNING</div>
        </div>
        <div class="status-card">
          <div class="status-label">Uptime</div>
          <div class="status-value">${Math.floor(status.uptime / 3600)}h</div>
          <div class="status-badge badge-ok">HEALTHY</div>
        </div>
        <div class="status-card">
          <div class="status-label">Sessions</div>
          <div class="status-value">${status.counts.sessions}</div>
          <div class="status-badge badge-ok">ACTIVE</div>
        </div>
        <div class="status-card">
          <div class="status-label">Tool Executions</div>
          <div class="status-value">${status.counts.toolExecutions}</div>
          <div class="status-badge badge-ok">OK</div>
        </div>
      `;

        document.getElementById('status-container').innerHTML = html;
      } catch (err) {
        console.error('Failed to load status:', err);
        document.getElementById('status-container').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    async function loadHealth() {
      try {
        const health = await apiClient.getHealth();

        const checks = Object.entries(health.checks || {})
          .map(([key, value]) => {
            const isOk = value === 'ok';
            return `
          <tr>
            <td>${key}</td>
            <td>
              <span class="status-badge ${isOk ? 'badge-ok' : 'badge-error'}">
                ${value.toUpperCase()}
              </span>
            </td>
          </tr>
        `;
          })
          .join('');

        document.getElementById('health-container').innerHTML =
          '<table class="details-table"><thead><tr><th>Check</th><th>Status</th></tr></thead><tbody>' + checks + '</tbody></table>';
      } catch (err) {
        console.error('Failed to load health:', err);
        document.getElementById('health-container').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    async function loadMetrics() {
      try {
        const metrics = await apiClient.getMetrics();

        const rows = `
        <tr>
          <td>Request Success Rate</td>
          <td>${((metrics.requests.successful / metrics.requests.total) * 100 || 0).toFixed(1)}%</td>
        </tr>
        <tr>
          <td>Tool Execution Count</td>
          <td>${metrics.tools.executionCount}</td>
        </tr>
        <tr>
          <td>Tool Success Rate</td>
          <td>${(metrics.tools.successRate * 100).toFixed(1)}%</td>
        </tr>
        <tr>
          <td>Memory Entries Created</td>
          <td>${metrics.memory.entriesCreated}</td>
        </tr>
        <tr>
          <td>Simulation Runs</td>
          <td>${metrics.simulation.runCount}</td>
        </tr>
      `;

        document.getElementById('metrics-container').innerHTML =
          '<thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>' + rows + '</tbody>';
      } catch (err) {
        console.error('Failed to load metrics:', err);
        document.getElementById('metrics-container').innerHTML =
          '<tr><td colspan="2" class="empty">Error loading metrics: ' + err.message + '</td></tr>';
      }
    }

    async function loadEvents() {
      try {
        const result = await apiClient.getEvents(20);
        const events = result.events || [];

        if (!events.length) {
          document.getElementById('events-container').innerHTML = '<div class="empty">No events</div>';
          return;
        }

        const html = events
          .map(
            (event) => `
          <div class="event-item">
            <div class="event-time">${new Date(event.createdAt).toLocaleString()}</div>
            <div class="event-type">${event.type}</div>
            <div class="event-data">${JSON.stringify(event.data).substring(0, 100)}</div>
          </div>
        `
          )
          .join('');

        document.getElementById('events-container').innerHTML = html;
      } catch (err) {
        console.error('Failed to load events:', err);
        document.getElementById('events-container').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
      }
    }

    window.refreshStatus = loadStatus;
    window.refreshEvents = loadEvents;

    // Load all data on page load
    window.addEventListener('load', () => {
      loadStatus();
      loadHealth();
      loadMetrics();
      loadEvents();

      // Auto-refresh every 30 seconds
      setInterval(() => {
        loadStatus();
        loadHealth();
        loadMetrics();
      }, 30000);
    });
  </script>
</body>
</html>
