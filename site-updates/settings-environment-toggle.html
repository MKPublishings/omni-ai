<div class="env-settings-panel" id="settings-environment">

  <div class="env-settings-panel__title">
    <span>🌍</span> Environment Mode
  </div>

  <!-- Primary Toggle -->
  <div class="env-toggle-row">
    <div>
      <div class="env-toggle-row__label">Enable Environment Mode</div>
      <div class="env-toggle-row__desc">Activate planetary-scale environmental simulation</div>
    </div>
    <label class="env-toggle">
      <input type="checkbox" id="env-toggle-main" checked />
      <span class="env-toggle__slider"></span>
    </label>
  </div>

  <!-- Sub-Panel (shown when main toggle is on) -->
  <div class="env-settings-sub" id="env-settings-sub">

    <!-- Default Scale -->
    <div class="env-select-row">
      <span class="env-select-row__label">Default Scale Level</span>
      <select class="env-select" id="env-default-scale">
        <option value="0">L0 - Planet</option>
        <option value="1">L1 - Continent</option>
        <option value="2" selected>L2 - Country</option>
        <option value="3">L3 - State / Province</option>
        <option value="4">L4 - Metro Area</option>
        <option value="5">L5 - City</option>
        <option value="6">L6 - Village</option>
      </select>
    </div>

    <!-- Subsystem Checkboxes -->
    <div class="env-toggle-row" style="flex-direction: column; align-items: flex-start;">
      <div class="env-toggle-row__label" style="margin-bottom: 0.5rem;">Active Subsystems</div>
      <div class="env-checkbox-grid">
        <label><input type="checkbox" checked value="climate" /> 🌡️ Climate</label>
        <label><input type="checkbox" checked value="hydrology" /> 💧 Hydrology</label>
        <label><input type="checkbox" checked value="ecology" /> 🌿 Ecology</label>
        <label><input type="checkbox" checked value="geology" /> ⛰️ Geology</label>
        <label><input type="checkbox" checked value="infrastructure" /> 🏗️ Infrastructure</label>
        <label><input type="checkbox" checked value="population" /> 👥 Population</label>
        <label><input type="checkbox" checked value="energy" /> ⚡ Energy</label>
        <label><input type="checkbox" checked value="economy" /> 📈 Economy</label>
        <label><input type="checkbox" checked value="governance" /> 🏛️ Governance</label>
        <label><input type="checkbox" checked value="transport" /> 🚢 Transport</label>
      </div>
    </div>

    <!-- Cross-Scale Propagation -->
    <div class="env-toggle-row">
      <div>
        <div class="env-toggle-row__label">Cross-Scale Propagation</div>
        <div class="env-toggle-row__desc">Propagate state changes up and down the scale hierarchy</div>
      </div>
      <label class="env-toggle">
        <input type="checkbox" id="env-toggle-propagation" checked />
        <span class="env-toggle__slider"></span>
      </label>
    </div>

    <!-- Time Acceleration -->
    <div class="env-select-row">
      <span class="env-select-row__label">Time Acceleration</span>
      <select class="env-select" id="env-time-accel">
        <option value="1" selected>1x (Real-time)</option>
        <option value="10">10x</option>
        <option value="100">100x</option>
        <option value="1000">1000x</option>
      </select>
    </div>

    <!-- Snapshot Interval -->
    <div class="env-select-row">
      <span class="env-select-row__label">Snapshot Interval</span>
      <select class="env-select" id="env-snapshot-interval">
        <option value="10">Every 10 ticks</option>
        <option value="50" selected>Every 50 ticks</option>
        <option value="100">Every 100 ticks</option>
        <option value="500">Every 500 ticks</option>
        <option value="0">Disabled</option>
      </select>
    </div>

    <!-- Log Verbosity -->
    <div class="env-select-row">
      <span class="env-select-row__label">Log Verbosity</span>
      <select class="env-select" id="env-log-verbosity">
        <option value="error">Error only</option>
        <option value="warn" selected>Warn</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>
    </div>

    <!-- Reset -->
    <button class="env-btn-reset" id="env-reset-defaults" type="button">
      Reset to Defaults
    </button>

  </div>

</div>

<script>
  // Toggle sub-panel visibility
  document.getElementById('env-toggle-main')?.addEventListener('change', (e) => {
    const sub = document.getElementById('env-settings-sub');
    if (sub) sub.style.display = e.target.checked ? 'block' : 'none';
  });

  // Reset to defaults
  document.getElementById('env-reset-defaults')?.addEventListener('click', () => {
    document.getElementById('env-default-scale').value = '2';
    document.getElementById('env-time-accel').value = '1';
    document.getElementById('env-snapshot-interval').value = '50';
    document.getElementById('env-log-verbosity').value = 'warn';
    document.getElementById('env-toggle-propagation').checked = true;
    document.querySelectorAll('.env-checkbox-grid input[type="checkbox"]').forEach(cb => cb.checked = true);
  });
</script>
